name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q api financial_news_analyzer
      - run: python -m unittest discover -s financial_news_analyzer/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app.js
